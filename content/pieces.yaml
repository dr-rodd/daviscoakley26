- id: "09"
  title: "The Voice Within"
  artist: ""
  role: "Members of Laryngectomy Outpatients Music Therapy Voice Group, St. James’s Hospital, Dublin"
  affiliation: "Speech & Language Dept., Music Therapy Dept., Creative Life, MISA, St. James’s Hospital, Dublin."
  form: "Poetry"
  medium: ""
  description:
    - "Laryngectomy surgery is life-changing, resulting in permanent changes to breathing, speaking and swallowing and overall quality of life. We present a collection of poems and song lyrics penned by patients exploring their experiences of ageing with a “new voice” and life after laryngectomy. These pieces reflect moments from their lived experiences and were developed as part of Voice Group Music Therapy sessions, delivered in collaboration with the Speech and Language Therapy Department and Music Therapy at Creative Life MISA at St. James’s Hospital. The collection was co-curated by Marina Cassidy (Music Therapist) and Deirdre Leavy (Speech & Language Therapist). Marina Cassidy, Music Therapist, SJH."
  sections: []
  closing: []

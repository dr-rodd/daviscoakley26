<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{ sign_css }}
@page {
  size: 210mm 297mm;
  margin: 0;
}
</style>
</head>
<body>
<div class="sheet">
  <div class="cutline-h"></div>
  {% for top in positions %}
  <div class="sign" style="top: {{ top }};">
    <div class="sign-left">
      <h2 class="sign-title">{{ title }}</h2>
      <p class="sign-theme">{{ theme }}</p>
      <p class="sign-meta">{{ meta }}</p>
    </div>
    <div class="sign-right">
      <img class="sign-qr" src="{{ qr_path }}">
      <p class="sign-qr-caption">Scan to view all works</p>
    </div>
    <div class="sign-footer-left">
      <img class="sign-logo" src="{{ logo_path }}">
      <p class="sign-label">Davis Coakley Award 2026</p>
    </div>
  </div>
  {% endfor %}
</div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
{{ card_css }}
@page {
  size: 154mm 111mm; /* 148x105 card + 3mm bleed on every side */
  margin: 0;
}
.card {
  margin: 3mm; /* inset the safe card content by the bleed amount */
}
.card-bleed {
  position: absolute;
  inset: -3mm;
  background: #ffffff;
  z-index: -1;
}
</style>
</head>
<body>
{% for card in cards %}
<div class="card">
  <div class="card-bleed"></div>
  <div class="card-left">
    <h2 class="card-title"><span class="card-num">{{ card.num }}</span>{{ card.title }}</h2>
    <p class="card-artist">{{ card.artist }}</p>
    {% if card.role %}<p class="card-role">{{ card.role }}</p>{% endif %}
    {% if card.affiliation %}<p class="card-affiliation">{{ card.affiliation }}</p>{% endif %}
    <p class="card-form">{{ card.form_medium }}</p>
  </div>
  <div class="card-right">
    <img class="card-qr" src="{{ card.qr_path }}">
    <p class="card-qr-caption">Scan to read more</p>
  </div>
  <div class="card-footer-left">
    <img class="card-logo" src="{{ logo_path }}">
    <p class="card-label">Davis Coakley Award 2026</p>
  </div>
</div>
{% endfor %}
</body>
</html>
